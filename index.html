<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slides</title>
    <style>
      @font-face {
        src: url("assets/fonts/Ubuntu/UbuntuSans-Regular.ttf") format("truetype");
        font-family: "Ubuntu Sans";
        font-weight: 400;
        font-style: normal;
      }
      @font-face {
        src: url("assets/fonts/Ubuntu/UbuntuSans-Bold.ttf") format("truetype");
        font-family: "Ubuntu Sans";
        font-weight: 700;
        font-style: normal;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Ubuntu Sans", sans-serif;
        background: #f8f9fa;
        color: #353a3f;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 3rem 1.5rem;
      }

      header {
        margin-bottom: 2.5rem;
        text-align: center;
      }

      header h1 {
        font-size: 2rem;
        font-weight: 700;
        color: #212529;
      }

      header p {
        margin-top: 0.4rem;
        color: #353a3f;
      }

      ul {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 1rem;
        width: 100%;
        max-width: 560px;
      }

      li a {
        display: block;
        padding: 1rem 1.4rem;
        background: #e9ecee;
        border: 1px solid #dce0e4;
        border-radius: 8px;
        text-decoration: none;
        color: #1862ab;
        font-weight: 700;
        font-size: 1.05rem;
        transition:
          background 0.15s,
          border-color 0.15s;
      }

      li a:hover {
        background: #c8cbd8;
        border-color: #8c4351;
        color: #8c4351;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Slides</h1>
      <p>A collection of my presentation slides.</p>
    </header>
    <ul>
      <li>
        <a href="deterministic-builds-with-nix/"
          >Deterministic Builds with Nix</a
        >
      </li>
      <li>
        <a href="do-you-want-to-build-a-snowflake/"
          >Do You Want to Build a Snowflake?</a
        >
      </li>
    </ul>
  </body>
</html>
